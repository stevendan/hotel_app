<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mövenpick Living West Hanoi - Công cụ sự kiện</title>
  <style>
    :root {
      --navy: #15355f;
      --navy-dark: #0d274a;
      --gold: #ae842d;
      --gold-soft: #fbf4e5;
      --ink: #1d2939;
      --muted: #667085;
      --line: #d9e1ec;
      --surface: #ffffff;
      --background: #f3f6fa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--ink);
      background: var(--background);
    }

    .site-header {
      padding: 48px 16px 40px;
      text-align: center;
      color: #fff;
      background: linear-gradient(135deg, var(--navy-dark), var(--navy));
    }

    .eyebrow {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .site-header h1 { margin: 0 0 8px; font-size: 28px; }
    .site-header p.subtitle { margin: 0; color: rgba(255, 255, 255, 0.8); }

    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
      max-width: 820px;
      margin: -24px auto 48px;
      padding: 0 16px;
    }

    .menu-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 32px 24px;
      text-align: center;
      text-decoration: none;
      color: inherit;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(21, 53, 95, 0.08);
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    }

    .menu-card:hover,
    .menu-card:focus-visible {
      transform: translateY(-4px);
      border-color: var(--gold);
      box-shadow: 0 10px 28px rgba(21, 53, 95, 0.16);
      outline: none;
    }

    .menu-icon {
      display: grid;
      place-items: center;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      color: var(--gold);
      background: var(--gold-soft);
    }

    .menu-icon svg { width: 36px; height: 36px; }

    .menu-card h2 { margin: 4px 0 0; font-size: 20px; color: var(--navy); }
    .menu-card p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--muted); }
  </style>
</head>
<body>
  <header class="site-header">
    <p class="eyebrow">Mövenpick Living West Hanoi</p>
    <h1>Công cụ sự kiện</h1>
    <p class="subtitle">Chọn chức năng bạn muốn sử dụng</p>
  </header>

  <main class="menu">
    <a class="menu-card" href="contract/index.html">
      <span class="menu-icon">
        <!-- Contract icon: document with signature -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <path d="M14 2v6h6"/>
          <path d="M8 13h8M8 9h3"/>
          <path d="M8 18c1-1.5 2-1.5 2.5 0s1.5 1.5 2.5 0 1.5-1 3 0"/>
        </svg>
      </span>
      <h2>Hợp đồng</h2>
      <p>Tạo hợp đồng sự kiện từ mẫu có sẵn và xuất file Word.</p>
    </a>

    <a class="menu-card" href="proposal/index.html">
      <span class="menu-icon">
        <!-- Proposal icon: price tag / quotation -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 2h6a1 1 0 0 1 1 1v1h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2V3a1 1 0 0 1 1-1z"/>
          <path d="M8 4h8"/>
          <path d="M14.5 10.5c-.4-.9-1.3-1.5-2.5-1.5-1.4 0-2.5.8-2.5 1.9 0 2.6 5 1.4 5 4 0 1.1-1.1 1.9-2.5 1.9-1.2 0-2.1-.6-2.5-1.5"/>
          <path d="M12 8v1M12 16.8v1"/>
        </svg>
      </span>
      <h2>Báo giá</h2>
      <p>Phân tích tin nhắn khách hàng và xuất file báo giá hội thảo.</p>
    </a>
  </main>
</body>
</html>
